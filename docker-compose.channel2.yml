version: '3.3'

services:
  q2api-channel2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: q2api-channel2
    ports:
      - "8001:8000"
    env_file:
      - .env.channel2
    volumes:
      - ./:/app
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
